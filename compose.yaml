services:
  archive:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_PATH: /app/data/archive.sqlite
      STORAGE_DRIVER: ${STORAGE_DRIVER:-r2}
      LOCAL_STORAGE_PATH: /app/data/storage
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_PRIVATE_BUCKET: ${R2_PRIVATE_BUCKET:-campus-archive-private}
      R2_PUBLIC_BUCKET: ${R2_PUBLIC_BUCKET:-campus-archive-public}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in your runtime environment}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set BETTER_AUTH_URL to the exact application origin}
    volumes:
      - archive-data:/app/data
    restart: unless-stopped

volumes:
  archive-data:
